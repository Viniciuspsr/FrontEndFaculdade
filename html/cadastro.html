<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <link rel="stylesheet" href="../css/style.css">
  <script type="module" src="../js/tema.js"></script>
  <script type="module" src="../js/formulario.js"></script>
  <script type="module" src="../js/interacoes.js"></script>

</head>

<body class="pagina-cadastro">
  <header>
    <nav>
      <a href="index.html">Nome da ONG</a>

      <ul>
        <li>
          <a href="index.html">Início</a>
        </li>

        <li>
          <a href="index.html">Projetos</a>
        </li>

        <li>
          <a href="cadastro.html">Cadastro</a>
        </li>
      </ul>

      <button id="botao-tema" type="button">
        Modo escuro
      </button>
    </nav>
  </header>

  <main>

    <h1 id="titulo-cadastro">Cadastro</h1>

    <form id="form-cadastro" novalidate>


      <fieldset>
        <legend>Dados pessoais</legend>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento" required>

        <label for="cpf">CPF:</label>
        <input type="tel" id="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required>

        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" pattern="[0-9]{11}" required>

      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP:</label>
        <input type="tel" id="cep" pattern="[0-9]{8}" required>

        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" required>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" required>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" required>

      </fieldset>

      <button type="submit">
        <span>Enviar</span>
      </button>


    </form>

    <div class="alert" role="alert">
      Cadastro realizado com sucesso!
    </div>


    </div>
  </main>

  <footer>

  </footer>
</body>

</html>
